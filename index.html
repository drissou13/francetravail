<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>France Travail - Simulation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #eef0fb;
    }

    header {
      background: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    header img {
      height: 40px;
    }

    .btn {
      background: #222865;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      max-width: 1000px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, select, textarea {
      width: 100%;
      padding: 0.7rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 2rem;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .modal-content input {
      margin-top: 1rem;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
    }

    .success-message, .error-message {
      padding: 1rem;
      margin-top: 1rem;
      border-radius: 10px;
      display: none;
      text-align: center;
    }

    .success-message {
      background: #e2ffe2;
      color: #1e7a1e;
    }

    .error-message {
      background: #ffe2e2;
      color: #c70000;
    }

    .actualisation-form {
      display: none;
      margin-top: 2rem;
    }
  </style>
</head>

<div class="container">
  <div class="title">Recherche d’offres</div>
  <input type="text" placeholder="Métier, mot-clé, n° d'offre">
  <input type="text" placeholder="Lieu de travail">
  <button class="btn" style="margin-top: 1rem;">Rechercher</button>

  <div class="success-message" id="successMessage">
    ✅ Connexion réussie. Actualisation ouverte.
  </div>
  <div class="error-message" id="errorMessage">
    ❌ Échec de la connexion. Veuillez vérifier vos identifiants.
  </div>

  <div class="actualisation-form" id="actualisationForm">
    <h3>Formulaire d'actualisation - Avril 2025</h3>
    <label for="situation">1. Quelle est votre situation actuelle ?</label>
    <select id="situation">
      <option value="">-- Choisir --</option>
      <option value="recherche">Toujours à la recherche d'un emploi</option>
      <option value="travail">En emploi</option>
      <option value="formation">En formation</option>
      <option value="autre">Autre situation</option>
    </select>

    <label for="heures">2. Avez-vous travaillé ce mois-ci ? Si oui, combien d'heures ?</label>
    <input type="number" id="heures" placeholder="Ex : 35">

    <label for="revenu">3. Avez-vous perçu un revenu ? Si oui, indiquez le montant (€) :</label>
    <input type="number" id="revenu" placeholder="Ex : 1250">

    <label>Souhaitez-vous rester inscrit à France Travail ?</label><br/>
<select id="inscription">
  <option value="oui">Oui</option>
  <option value="non">Non</option>
</select><br/><br/>

    <button class="btn" style="margin-top: 1rem;" onclick="finaliserActualisation()">Finaliser l'actualisation</button>
  </div>
</div>

    <h2>Connexion <span style="color:#4c3cbf;">candidat</span></h2>
    <p style="font-style: italic;">Tous les champs sont obligatoires</p>

    <label>Nom d'utilisateur</label>
    <input type="text" id="username" placeholder="Nom d'utilisateur">
    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="Mot de passe">

    <div class="modal-actions">
      <button class="btn" style="background:#aaa;" onclick="closeModal()">Annuler</button>
      <button class="btn" onclick="simulateLogin()">Poursuivre</button>
    </div>
  </div>
</div>

<script>
  function openModal() {
    document.getElementById("loginModal").style.display = "block";
    document.getElementById("errorMessage").style.display = "none";
  }

  function closeModal() {
    document.getElementById("loginModal").style.display = "none";
  }

  function simulateLogin() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "rsnl" && password === "azerty123") {
      closeModal();
      document.getElementById("successMessage").style.display = "block";
      document.getElementById("actualisationForm").style.display = "block";
    } else {
      document.getElementById("errorMessage").style.display = "block";
    }
  }

  function finaliserActualisation() {
    const situation = document.getElementById("situation").value;
    const heures = document.getElementById("heures").value;
    const revenu = document.getElementById("revenu").value;
    const commentaires = document.getElementById("commentaires").value;

    if (!situation) {
      alert("Veuillez renseigner votre situation actuelle.");
      return;
    }

    alert(`✅ Actualisation envoyée :\n\n- Situation : ${situation}\n- Heures travaillées : ${heures || 'Aucune'}\n- Revenu : ${revenu || 'Aucun'}€\n- Commentaire : ${commentaires || 'Aucun'}`);
  }
</script>

</body>
</html>
